<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AmitKT — Indian Politics</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <h1 id="site-title">AmitKT — Indian Politics</h1>
        <p id="site-subtitle">Articles, explainers and political analysis</p>
      </div>
      <div class="header-controls">
        <button id="lang-toggle" aria-label="Toggle language">EN / हिन्दी</button>
        <button id="dark-toggle" aria-label="Toggle dark">🌙</button>
      </div>
    </div>
    <div id="header-image" class="header-image" role="img" aria-label="Header image"></div>
  </header>

  <main class="container">
    <section class="toolbar">
      <input id="search" placeholder="Search articles" aria-label="Search articles">
    </section>

    <section id="posts-list" class="posts-grid" aria-live="polite">
      <!-- Cards inserted here -->
    </section>

    <div id="ad-slot-1" class="ad-slot">AD PLACEHOLDER</div>

    <article id="post-view" class="post-view" hidden>
      <a href="/" id="back-to-list">← Back to list</a>
      <h2 id="post-title"></h2>
      <div class="meta" id="post-meta"></div>
      <img id="post-hero" class="post-hero" alt="">
      <div id="post-content"></div>
      <div id="reading-progress" class="reading-progress"><div></div></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="footer-title">AmitKT</span></div>
  </footer>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
  <script src="/js/site.js"></script>
</body>
</html>
