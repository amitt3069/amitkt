<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AmitKT | Indian Politics</title>
  <meta name="description" content="AmitKT brings Indian politics, analysis and explainers in English and Hindi." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-left">
        <span>India</span>
        <span>Politics</span>
        <span>Analysis</span>
      </div>
      <div class="topbar-right">
        <button class="small-btn" id="lang-toggle" aria-label="Toggle language">EN / हिन्दी</button>
        <button class="small-btn" id="dark-toggle" aria-label="Toggle dark mode">Dark</button>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-block">
        <div class="brand-mark">A</div>
        <div>
          <div class="brand-name" id="site-title">AmitKT</div>
          <div class="brand-tag" id="site-subtitle">Indian Politics</div>
        </div>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#">National</a>
        <a href="#">Elections</a>
        <a href="#">Policy</a>
        <a href="#">Analysis</a>
        <a href="#">Opinion</a>
      </nav>
      <button class="subscribe-btn">Subscribe</button>
    </div>
  </header>

  <main class="container page-shell">
    <section class="featured-area" id="featured-area"></section>

    <section class="toolbar-row">
      <div class="chip-group" id="category-tabs">
        <button class="chip active" data-category="all">All</button>
        <button class="chip" data-category="National">National</button>
        <button class="chip" data-category="Elections">Elections</button>
        <button class="chip" data-category="Policy">Policy</button>
        <button class="chip" data-category="Analysis">Analysis</button>
        <button class="chip" data-category="Opinion">Opinion</button>
      </div>
      <div class="search-box">
        <input id="search" type="search" placeholder="Search articles" aria-label="Search articles" />
      </div>
    </section>

    <section class="content-grid">
      <div class="main-column">
        <div class="section-head">
          <h2>Latest stories</h2>
        </div>
        <div id="post-list" class="story-grid"></div>
      </div>

      <aside class="sidebar-column">
        <div class="sidebar-card">
          <div class="mini-head">Trending</div>
          <ul id="trending-list" class="trending-list"></ul>
        </div>

        <div class="ad-box">Ad Space</div>
      </aside>
    </section>

    <article id="post-view" class="article-view hidden" aria-live="polite">
      <button class="back-link" id="back-to-list">← Back to latest</button>
      <header class="article-header">
        <div class="article-kicker" id="article-kicker"></div>
        <h1 id="article-title"></h1>
        <div class="article-meta" id="article-meta"></div>
      </header>
      <img id="article-hero" class="article-hero" alt="Article hero" />
      <div class="article-body" id="article-body"></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <div class="brand-name">AmitKT</div>
        <div class="brand-tag">Political reporting and analysis</div>
      </div>
      <div id="footer-copy">© 2026 AmitKT</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
  <script src="/js/site.js"></script>
</body>
</html>
